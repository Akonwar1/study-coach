<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Coach</title>
  <!-- Literata (headings and question text), Source Sans 3 (everything else) and Source Code Pro (code, timers), chosen
       for reading comfort; see PLAN.md, 2026-11-15. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&amp;family=Source+Code+Pro:wght@400;600&amp;family=Source+Sans+3:ital,wght@0,400..700;1,400&amp;display=swap">
  <link rel="stylesheet" href="v/8cb1df5adc50/styles.css">
  <!-- Dark is the default; a saved choice of light mode (src/theme.js, key in src/storage.js) is applied here, before
       anything is drawn, so the page never flashes dark first. -->
  <script>try { if (JSON.parse(localStorage.getItem("studyCoach.theme")) === "light") document.documentElement.dataset.theme = "light"; } catch { /* no storage: stay dark */ }</script>
</head>
<body>
  <!-- Soft colour clouds behind every screen, wandering and shifting colour slowly, and small motes rising through them (styles.css, "the illustrated look"; src/sky.js). -->
  <div class="sky" aria-hidden="true">
    <!-- Eight clouds spread over the page, each wandering around its own home (--cx, --cy) on its own path and timing,
         starting at a different point, and slowly shifting colour (styles.css). -->
    <span class="sky-cloud" style="--cx: 15%; --cy: 14%; --c: var(--accent); --path: sky-wander-a; --time: 84s; --tint: sky-tint-purple; --tint-time: 96s; --delay: -12s"></span>
    <span class="sky-cloud" style="--cx: 52%; --cy: 10%; --c: var(--teal); --path: sky-wander-c; --time: 92s; --tint: sky-tint-teal; --tint-time: 88s; --delay: -47s"></span>
    <span class="sky-cloud" style="--cx: 84%; --cy: 24%; --c: var(--manila); --path: sky-wander-b; --time: 100s; --tint: sky-tint-amber; --tint-time: 120s; --delay: -71s"></span>
    <span class="sky-cloud" style="--cx: 47%; --cy: 47%; --c: var(--info); --path: sky-wander-a; --time: 108s; --tint: sky-tint-blue; --tint-time: 76s; --delay: -30s"></span>
    <span class="sky-cloud" style="--cx: 12%; --cy: 63%; --c: var(--teal); --path: sky-wander-b; --time: 88s; --tint: sky-tint-teal; --tint-time: 104s; --delay: -58s"></span>
    <span class="sky-cloud" style="--cx: 82%; --cy: 79%; --c: var(--accent); --path: sky-wander-c; --time: 96s; --tint: sky-tint-purple; --tint-time: 84s; --delay: -5s"></span>
    <span class="sky-cloud" style="--cx: 44%; --cy: 88%; --c: var(--manila); --path: sky-wander-a; --time: 104s; --tint: sky-tint-amber; --tint-time: 112s; --delay: -83s"></span>
    <span class="sky-cloud" style="--cx: 18%; --cy: 90%; --c: var(--info); --path: sky-wander-c; --time: 98s; --tint: sky-tint-blue; --tint-time: 92s; --delay: -40s"></span>
    <!-- The motes are added by src/sky.js, as many as the window's width needs. -->
  </div>
  <div class="app">
    <header class="masthead">
      <div class="masthead-text">
        <p class="eyebrow">The Study Index</p>
        <h1>Study Coach</h1>
        <p class="tagline">Answer a few quick questions and get the study method that fits what you’re facing right now.</p>
      </div>
      <!-- The open tab's drawn scene, filled in by src/masthead-art.js. -->
      <div class="masthead-scene" aria-hidden="true"></div>
    </header>

    <nav class="tabs" aria-label="Sections" id="tabs"></nav>

    <main id="main" aria-live="polite"></main>

    <footer class="note">
      <p>Built on the ten-technique review by Dunlosky, Rawson, Marsh, Nathan &amp; Willingham (2013), <em>Psychological Science in the Public Interest</em>.</p>
      <button class="theme-switch" type="button">☀ Light mode</button>
    </footer>
  </div>
  <script type="module" src="v/8cb1df5adc50/src/app.js"></script>
</body>
</html>
